name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - name: Check out history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          while read -r commit; do
            [ -z "$commit" ] && continue
            if ! git log -1 --format=%B "$commit" \
                | grep -qE '^Signed-off-by: .+ <[^<>]+>$'; then
              echo "::error::Commit $commit is missing a Signed-off-by line."
              echo "Fix with: git rebase --signoff $BASE"
              failed=1
            fi
          done < <(git rev-list "$BASE..$HEAD")
          exit "$failed"
